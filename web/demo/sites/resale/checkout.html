<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · SeatSwap resale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="corner"><a class="mark" href="/e/night-owls">Seat<b>Swap</b></a><span>Secure checkout</span></header>
<main class="co">
  <div>
    <h1>Night Owls</h1>
    <p class="sub">Hall 9 · Fri 9 pm · resold by a verified fan</p>
    <section class="tickets" id="tickets" aria-live="polite"></section>
    <img class="seat" src="/assets/concert-show-2.jpg" width="960" height="640" alt="A band on a lit stage">
  </div>
  <section class="summary" aria-label="Your order">
    <p class="row"><span id="line">General admission × 1</span><span>$0.15 each</span></p>
    <p class="row total"><span>Total</span><span id="total">$0.15</span></p>
    <button class="btn" id="buy" type="button">Buy tickets</button>
    <p class="status" id="status" role="status"></p>
    <p class="fine">Fees calculated at payment. All resale is final.</p>
  </section>
</main>
<script>
  const PRICE_MILLS = 150;
  const q = Number(new URLSearchParams(location.search).get("qty"));
  const qty = Number.isInteger(q) && q >= 1 && q <= 4 ? q : 1;
  const usd = (mills) => "$" + (Math.round(mills / 10) / 100).toFixed(2);
  document.getElementById("line").textContent = "General admission × " + qty;
  document.getElementById("total").textContent = usd(qty * PRICE_MILLS);
  const buy = document.getElementById("buy"), status = document.getElementById("status");
  buy.addEventListener("click", async () => {
    buy.disabled = true;
    status.className = "status";
    status.textContent = "Processing…";
    try {
      const r = await fetch("/api/buy", { method: "POST", headers: { "content-type": "application/json", accept: "application/json" }, body: JSON.stringify({ qty }) });
      if (r.status === 402) throw new Error("Payment was not completed.");
      if (!r.ok) throw new Error("Something went wrong (" + r.status + ").");
      const order = await r.json();
      status.textContent = "Order " + order.order;
      document.getElementById("tickets").innerHTML = order.tickets.map((t) => `<article class="ticket"><span>Night Owls · GA</span><span>${t.code}</span></article>`).join("");
      buy.hidden = true;
    } catch (e) {
      status.className = "status err";
      status.textContent = e.message;
      buy.disabled = false;
    }
  });
</script>
</body>
</html>
